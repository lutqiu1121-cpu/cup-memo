name: build-apk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    # Pinned (not `ubuntu-latest`) so a runner image rollover cannot silently
    # change the Android SDK / NDK / Java toolchain under us.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned instead of `channel: stable`: Flutter 3.50 moved Material to
          # `package:material_ui/material_ui.dart` and deprecated
          # `package:flutter/material.dart` (16 info-level diagnostics). This
          # project is developed and verified on 3.47.8.
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Install SQLite shared library for unit tests
        # `package:sqlite3` loads `libsqlite3.so` on Linux; the runner image only
        # ships the versioned runtime library, so `libsqlite3-dev` provides the
        # unversioned symlink that `DynamicLibrary.open` needs.
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: flutter analyze
        # Deprecation/lint *infos* must not fail the pipeline; real errors still
        # do, because `--no-fatal-infos`/`--no-fatal-warnings` only relax
        # `error`-level gating.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        run: flutter test --reporter expanded

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cup-memo-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha1
          if-no-files-found: error
          retention-days: 14
